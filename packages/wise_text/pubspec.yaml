name: wise_text
description: "Text widget with auto classification and rich text support using styled_text. Using NSDataDetector on iOS and TextClassifier on Android"
version: 1.1.0
homepage: https://github.com/wisemen-digital/wisemen-flutter-packages/packages/wise_text
repository: https://github.com/wisemen-digital/wisemen-flutter-packages/packages/wise_text

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
resolution: workspace
dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  jni: ^1.0.0
  jni_flutter: ^1.0.1
  objective_c: ^9.4.1
  styled_text: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  swiftgen: ^0.2.0
  ffigen: ^22.0.0
  logging: ^1.3.0
  pub_semver: ^2.2.0
  swift2objc: ^0.3.1
  jnigen: ^1.0.1

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
